# CCTV prototype config (committed to git).
# Never put passwords here: camera addresses come from .env (copy .env.example to .env).
# Each ${NAME} below is replaced with the value from .env when go2rtc starts.

app:
  # go2rtc modules to run. Remove this block to run every module.
  modules: [api, ws, http, rtsp, webrtc, mp4, hls, mjpeg, mpegts, onvif, ffmpeg, exec, echo, expr, debug, cctv]

api:
  listen: ":1984"   # web UI + API: http://localhost:1984

rtsp:
  listen: ":8554"   # restream: rtsp://localhost:8554/cam1

webrtc:
  listen: ":8555"

streams:
  # Q-Tech Wi-Fi cameras (two-way audio). Fill CAM1_URL / CAM2_URL in .env.
  cam1: ${CAM1_URL}
  cam2: ${CAM2_URL}
  # Optional: a dual-lens camera sends both lenses in one picture, one above the other.
  # Set DUAL_URL in .env and make cam1 / cam2 its top and bottom half (see .env.example).
  dual: ${DUAL_URL:}

ffmpeg:
  # Input template for using a video file as a fake camera (loops forever).
  # In .env: CAM1_URL=ffmpeg:samples/test.mp4#input=loop#video=copy#audio=copy
  loop: "-re -stream_loop -1 -i {input}"

cctv:
  cameras: [cam1, cam2]        # go2rtc stream names to watch
  interval: 5s                 # how often camera status is checked
  offline_after: 20s           # no new data for this long = camera offline
  events_file: data/events.jsonl
  max_events: 1000             # events kept in memory for the API
  names: {cam1: Front corridor, cam2: Main gate}   # place names shown on the dashboard
  use_cases:                                       # shown as "configured" (edit to match the worker)
    cam1: [intrusion, restricted_area, occupancy, fall, face_recognition, fire, baby_crying, power_when_absent, tampering]
    cam2: [vehicle_lpr, intrusion, face_recognition, fire, tampering]
  snapshots_dir: data/snapshots
  siren:
    use_cases: [intrusion, restricted_area, fire]
    max: 3m
    file: data/siren.wav
    audio: pcma        # the camera's two-way audio codec: pcma, pcmu or aac

log:
  level: info
  cctv: info
