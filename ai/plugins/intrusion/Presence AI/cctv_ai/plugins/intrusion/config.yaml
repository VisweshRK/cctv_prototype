# Intrusion Detection Plugin – Configuration
# =============================================
# Place this file next to __init__.py and customise to your setup.

# ── Model ────────────────────────────────────────────────────────────────
model: yolov8n.pt             # Options: yolov8n / yolov8s / yolov8m / yolov8l / yolov8x
                               # Nano (n) is fastest; Extra-large (x) is most accurate.

confidence: 0.45               # Minimum detection confidence (0.0–1.0)

# COCO class IDs to watch.  Common ones:
#   0 = person,  1 = bicycle,  2 = car,  3 = motorcycle,
#   5 = bus,     7 = truck
classes:
  - 0   # person
  - 2   # car

# ── Cooldown ─────────────────────────────────────────────────────────────
cooldown_seconds: 30           # Suppress duplicate alerts for this many seconds
                               # (per camera × zone × object class)

# ── Restricted Zones ─────────────────────────────────────────────────────
# Define one or more polygons per camera.  Coordinates are NORMALISED
# (0.0–1.0) so they stay correct regardless of resolution.
#
# Tip: use the zone-editor UI or any image annotation tool to grab the
# vertex coordinates, then divide by the frame width/height.
#
# If a camera has NO zones listed here, the entire frame is treated as
# a single "full_frame" zone.

zones:
  cam_front_door:
    - name: porch
      polygon:
        - [0.10, 0.40]
        - [0.60, 0.40]
        - [0.60, 0.95]
        - [0.10, 0.95]

  cam_backyard:
    - name: fence_line
      polygon:
        - [0.00, 0.30]
        - [1.00, 0.30]
        - [1.00, 1.00]
        - [0.00, 1.00]

    - name: shed
      polygon:
        - [0.70, 0.20]
        - [0.95, 0.20]
        - [0.95, 0.55]
        - [0.70, 0.55]

