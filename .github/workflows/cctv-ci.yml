name: CCTV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: test -z "$(gofmt -l internal/cctv)"
      - run: go vet ./internal/cctv/
      - run: go test ./internal/cctv/

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y libgl1  # needed by opencv-python
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
